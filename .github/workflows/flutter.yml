name: flutter

# 各平台 App（apps/flutter，backlog F-13，docs/ip/apps-plan.md 第 9 节）。改了它才跑检查，只用 Linux。
# 五个平台的安装包只在手动触发或打 app-v* 标签时打：macOS、Windows 的 Actions 分钟数贵。
on:
  pull_request:
    paths: ["apps/flutter/**", ".github/workflows/flutter.yml"]
  push:
    branches: [main]
    paths: ["apps/flutter/**", ".github/workflows/flutter.yml"]
    tags: ["app-v*"]
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  # 升级 Flutter 时改这里，pubspec.yaml 的 sdk 约束跟着看一眼。
  FLUTTER_VERSION: 3.47.9

defaults:
  run:
    working-directory: apps/flutter

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Dependency licenses
        run: dart run tool/check_licenses.dart
      # 原生插件（安全存储、打开链接）的 C++ 代码也要编得过。
      - name: Install system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libsecret-1-dev ninja-build
      - name: Build Linux
        run: flutter build linux --release

  installers:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/app-v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            out: build/linux/x64/release/bundle/
          - os: ubuntu-24.04
            target: apk
            out: build/app/outputs/flutter-apk/
          - os: macos-latest
            target: macos
            out: build/macos/Build/Products/Release/
          # 没有签名证书，只能编出来看能不能编过；装到 iPhone 上要开发者账号签名（apps-plan Q-12）。
          - os: macos-latest
            target: ios --no-codesign
            out: build/ios/iphoneos/
          - os: windows-latest
            target: windows
            out: build/windows/x64/runner/Release/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install system libraries
        if: runner.os == 'Linux' && matrix.target == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libsecret-1-dev ninja-build
      - run: flutter pub get --enforce-lockfile
      # 没有签名证书：Android 用调试签名，macOS 第一次打开要右键“打开”，Windows 会弹 SmartScreen 提示。
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: ip-app-${{ matrix.os }}-${{ strategy.job-index }}
          path: apps/flutter/${{ matrix.out }}
          if-no-files-found: error
