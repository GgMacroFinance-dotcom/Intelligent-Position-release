[package]
name = "ip-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
ip-connectors.workspace = true
ip-core.workspace = true
ip-mcp.workspace = true
ip-data.workspace = true
ip-engines.workspace = true
ip-models.workspace = true
ip-router.workspace = true
ip-runtime.workspace = true
ip-store.workspace = true
ip-tools.workspace = true
nix.workspace = true
reqwest.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs.workspace = true
uuid.workspace = true
# Web Push 的加密和签名（F-10）。和 rustls 用的是同一个 aws-lc-rs，同样的特性，不多编译东西。
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
sha2 = "0.11"

[dev-dependencies]
ip-store = { workspace = true, features = ["testing"] }
ip-connectors = { workspace = true, features = ["fake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rmcp.workspace = true
tempfile = "3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[lints]
workspace = true
