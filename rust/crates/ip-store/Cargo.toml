[package]
name = "ip-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ip-core.workspace = true
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# 给其他 crate 的测试用：每个测试一个临时 schema（`testing` 模块）。
testing = []
# 从 SQLite 版的 ip.db 导入（`import` 模块，`ip store import-sqlite`）。只有 ip-cli 打开。
import-sqlite = ["dep:rusqlite"]

[dev-dependencies]
rusqlite.workspace = true
tempfile = "3"
# TLS 测试：生成测试用的 CA 和证书，起假的 TLS 服务器。
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
