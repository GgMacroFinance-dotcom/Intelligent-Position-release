# Slack 应用清单（docs/ip/m2-spec.md D-15）。
# 在 https://api.slack.com/apps 选 “Create New App” → “From an app manifest”，选好工作区后粘贴这个文件。
# 建好以后：
#   1. “Basic Information” → “App-Level Tokens” 生成一个带 connections:write 的令牌（xapp-…），放进 SLACK_APP_TOKEN。
#   2. “Install App” 装进工作区，把 Bot User OAuth Token（xoxb-…）放进 SLACK_BOT_TOKEN。
#   3. 在要用的频道里 /invite 这个机器人。
# 清单字段按 2026-11 的资料写成，导入时 Slack 若提示字段有变，以 Slack 的提示为准。
display_information:
  name: I.P. 数字员工
  description: 智能岗位：在线程里 @我 提需求
features:
  bot_user:
    display_name: ip
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
